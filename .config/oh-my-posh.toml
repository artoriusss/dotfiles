version = 4

[[blocks]]
type = "prompt"
alignment = "left"

[[blocks.segments]]
type = "path"
style = "plain"
foreground = "cyan"
template = "{{ .Path }} "

[blocks.segments.properties]
style = "full"

[[blocks.segments]]
type = "git"
style = "plain"
foreground = "magenta"
template = "{{ .HEAD }} "

[[blocks.segments]]
type = "python"
style = "plain"
foreground = "yellow"
template = "{{ if .Venv }}({{ .Venv }}) {{ end }}"

[blocks.segments.properties]
fetch_version = false
display_mode = "environment"

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

[[blocks.segments]]
type = "text"
style = "plain"
foreground = "green"
foreground_templates = [
  "{{ if eq .Env.POSH_VI_MODE \"vicmd\" }}yellow{{ end }}",
  "{{ if ne .Code 0 }}red{{ end }}",
]
template = "{{ if eq .Env.POSH_VI_MODE \"vicmd\" }}<{{ else }}>{{ end }} "
