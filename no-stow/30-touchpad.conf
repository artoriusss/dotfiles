# Install to /etc/X11/xorg.conf.d/30-touchpad.conf
#
# Ported from GNOME org.gnome.desktop.peripherals.touchpad.
#
# Why this exists rather than using System Settings > Input Devices > Touchpad:
# Plasma 5.27's touchpad KCM on X11 finds touchpads by looking for devices that
# expose "libinput Tapping Enabled". The Logitech USB receiver exposes it too,
# sorts earlier by X device id, and the X11 KCM has no device picker -- so every
# Apply writes to the receiver and the real touchpad never changes.
#
# MatchIsTouchpad keys off udev's ID_INPUT_TOUCHPAD, which the receiver does not
# set, so these land on the right device.

Section "InputClass"
    Identifier "GNOME-ported touchpad settings"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"                # tap-to-click (GNOME default true)
    Option "TappingDragLock" "on"
    Option "NaturalScrolling" "on"       # natural-scroll (GNOME default true)
    Option "ClickMethod" "clickfinger"   # click-method='fingers'
    Option "ScrollMethod" "twofinger"    # two-finger-scrolling-enabled=true
    Option "DisableWhileTyping" "on"     # disable-while-typing (GNOME default true)
    Option "AccelSpeed" "0.523438"       # speed=0.5234375
EndSection
